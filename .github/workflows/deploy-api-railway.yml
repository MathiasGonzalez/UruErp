name: Deploy API → Railway

# Builds Docker images for the API and PgBouncer, pushes them to Docker Hub,
# then triggers a Railway redeploy for both services.
#
# ── Required Secrets ──────────────────────────────────────────────────────────
#   RAILWAY_TOKEN               – Railway CLI token (Account Settings → Tokens)
#   RAILWAY_SERVICE_ID          – Railway service ID for the API
#   RAILWAY_PGBOUNCER_SERVICE_ID – Railway service ID for the PgBouncer sidecar
#   DOCKER_USERNAME             – Docker Hub username
#   DOCKER_PASSWORD             – Docker Hub password / access token
#
# ── Environment Variables to set in Railway (API service) ─────────────────────
#   DATABASE_URL                 – Points to PgBouncer's private domain in Railway
#                                  e.g. postgresql://user:pass@${{PgBouncer.RAILWAY_PRIVATE_DOMAIN}}:5432/db
#   Jwt__Secret                  – A random 64-char secret string
#   AllowedOrigins               – Your Cloudflare Pages URL
#   UruFactura__RutEmisor        – DGI RUT
#   UruFactura__RazonSocialEmisor
#   UruFactura__DomicilioFiscal
#   UruFactura__Ambiente         – "Homologacion" or "Produccion"
#   UruFactura__RutaCertificado  – Path to .pfx inside the container, e.g. /app/certs/cert.pfx
#   UruFactura__PasswordCertificado
#
# ── Environment Variables to set in Railway (PgBouncer service) ───────────────
#   DATABASE_URL  – Points to the upstream Postgres service:
#                   postgresql://user:pass@${{Postgres.RAILWAY_PRIVATE_DOMAIN}}:5432/db
#                   (PgBouncer's entrypoint.sh parses this automatically)
#
# ── Cloudflare R2 Variables (optional, API service) ───────────────────────────
#   CloudflareR2__AccountId / BucketName / AccessKeyId / SecretAccessKey / PublicBaseUrl
#
# ── Invoice Mailer Worker Variables (optional, API service) ───────────────────
#   InvoiceMailer__WorkerUrl / ApiSecret
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["main"]
    paths:
      - "src/UruErpApp.Api/**"
      - "pgbouncer/**"
      - ".github/workflows/deploy-api-railway.yml"

  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  # ── Build & push API image ──────────────────────────────────────────────────
  build-api:
    name: Build & push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/urufactura-api
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/UruErpApp.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & push PgBouncer image ────────────────────────────────────────────
  build-pgbouncer:
    name: Build & push PgBouncer image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/urufactura-pgbouncer
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: pgbouncer
          file: pgbouncer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pgbouncer
          cache-to: type=gha,mode=max,scope=pgbouncer

  # ── Trigger Railway redeployment for both services ──────────────────────────
  deploy:
    name: Redeploy on Railway
    needs: [build-api, build-pgbouncer]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy API service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway service redeploy \
            --service ${{ secrets.RAILWAY_SERVICE_ID }} \
            --yes

      - name: Redeploy PgBouncer service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway service redeploy \
            --service ${{ secrets.RAILWAY_PGBOUNCER_SERVICE_ID }} \
            --yes
