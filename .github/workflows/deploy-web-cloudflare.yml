name: Deploy Web → Cloudflare Pages

# Builds the React/Vite frontend and deploys it to Cloudflare Pages using
# the Wrangler action. Only runs on push to `main` when files inside `src/uerp-web/` change.
#
# ── Required Secrets ──────────────────────────────────────────────────────────
#   CF_API_TOKEN   – Cloudflare API token with "Cloudflare Pages: Edit" permission
#                    (Cloudflare Dashboard → My Profile → API Tokens → Create Token)
#   CF_ACCOUNT_ID  – Cloudflare account ID (right-hand sidebar of any Cloudflare page)
#
# ── Required Variables (set as GitHub Actions variables, not secrets) ─────────
#   CF_PAGES_PROJECT – Name of the Cloudflare Pages project (create it once via
#                      "Pages → Create a project → Direct upload" in the dashboard)
#
# ── Build-time variable ────────────────────────────────────────────────────────
#   VITE_API_URL   – URL of the api-proxy Cloudflare Worker, e.g.
#                    https://api-proxy.your-account.workers.dev
#                    The frontend proxies ALL /api/* requests through this Worker.
#                    Do NOT set this to the Railway API URL directly.
#                    Set this as a GitHub Actions secret or variable.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["main"]
    paths:
      - "src/uerp-web/**"
      - ".github/workflows/deploy-web-cloudflare.yml"

  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write   # allows Cloudflare action to create GitHub deployments

    defaults:
      run:
        working-directory: src/uerp-web

    steps:
      - name: Validate required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          missing=""
          [ -z "$CF_API_TOKEN" ]  && missing="$missing CF_API_TOKEN"
          [ -z "$CF_ACCOUNT_ID" ] && missing="$missing CF_ACCOUNT_ID"
          [ -z "$VITE_API_URL" ]  && missing="$missing VITE_API_URL"
          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/uerp-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Point the frontend at the production Railway API.
          # The Vite config exposes this as __API_BASE__ in the bundle.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy src/uerp-web/dist --project-name=${{ vars.CF_PAGES_PROJECT }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
